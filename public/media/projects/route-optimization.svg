<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Manrope, system-ui, sans-serif">
  <title>Delivery route optimization — three vehicle routes from one depot</title>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#e6e6e6" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="#f6f7f6"/>
  <rect width="400" height="300" fill="url(#grid)"/>

  <!-- Unoptimized: one trip per stop -->
  <g stroke="#c9c9c9" stroke-width="1.5" stroke-dasharray="4 4">
    <path d="M200 160L130 70M200 160L70 100M200 160L55 170M200 160L115 150"/>
    <path d="M200 160L265 60M200 160L335 90M200 160L350 150M200 160L285 130"/>
    <path d="M200 160L150 240M200 160L105 262M200 160L255 258M200 160L325 222"/>
  </g>

  <!-- Optimized routes, one per vehicle -->
  <g fill="none" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M200 160L115 150L55 170L70 100L130 70Z" stroke="#14d68f"/>
    <path d="M200 160L265 60L335 90L350 150L285 130Z" stroke="#0d0d0d"/>
    <path d="M200 160L150 240L105 262L255 258L325 222Z" stroke="#0aa86e"/>
  </g>

  <!-- Stops -->
  <g fill="#fff" stroke="#0d0d0d" stroke-width="2">
    <circle cx="130" cy="70" r="6"/><circle cx="70" cy="100" r="6"/><circle cx="55" cy="170" r="6"/><circle cx="115" cy="150" r="6"/>
    <circle cx="265" cy="60" r="6"/><circle cx="335" cy="90" r="6"/><circle cx="350" cy="150" r="6"/><circle cx="285" cy="130" r="6"/>
    <circle cx="150" cy="240" r="6"/><circle cx="105" cy="262" r="6"/><circle cx="255" cy="258" r="6"/><circle cx="325" cy="222" r="6"/>
  </g>

  <!-- Depot -->
  <rect x="188" y="148" width="24" height="24" fill="#14d68f" stroke="#0d0d0d" stroke-width="2.5"/>
  <rect x="176" y="179" width="48" height="16" fill="#fff" stroke="#0d0d0d" stroke-width="1.5"/>
  <text x="200" y="191" text-anchor="middle" font-size="10" font-weight="700" fill="#0d0d0d">DEPOT</text>

  <!-- Result badge -->
  <g transform="translate(14 14)">
    <rect x="3" y="3" width="140" height="44" fill="#0d0d0d"/>
    <rect width="140" height="44" fill="#fff" stroke="#0d0d0d" stroke-width="2"/>
    <text x="10" y="24" font-size="19" font-weight="800" fill="#0aa86e">−65%</text>
    <text x="10" y="37" font-size="9.5" font-weight="600" fill="#6f6f6f">route cost · 10 scenarios</text>
  </g>

  <!-- Legend -->
  <g transform="translate(14 278)" font-size="9.5" font-weight="600" fill="#6f6f6f">
    <path d="M0 0H18" stroke="#14d68f" stroke-width="3.5"/>
    <text x="24" y="3.5">Optimized vehicle routes</text>
    <path d="M150 0H168" stroke="#c9c9c9" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="174" y="3.5">One trip per stop</text>
  </g>
</svg>
